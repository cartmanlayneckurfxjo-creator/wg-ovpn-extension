<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WG & OpenVPN Proxy</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="title">WG / OVPN</div>
      <div id="statusBadge" class="badge disconnected">Disconnected</div>
    </header>

    <div id="errorBox" class="error hidden"></div>

    <section class="controls">
      <label class="file-btn">
        + Import .conf / .ovpn
        <input id="fileInput" type="file" accept=".conf,.ovpn" multiple hidden />
      </label>
    </section>

    <ul id="profileList" class="profiles"></ul>

    <section class="bypass">
      <label for="portInput">Local proxy port (for Telegram / apps, 0 = auto)</label>
      <input id="portInput" type="number" min="0" max="65535" placeholder="3322" />
    </section>

    <section class="bypass">
      <label>OpenVPN credentials (if .ovpn requires auth)</label>
      <div class="auth-row">
        <input id="ovpnUser" type="text" placeholder="Username" />
        <input id="ovpnPass" type="password" placeholder="Password" />
      </div>
    </section>

    <section class="bypass">
      <label for="bypassInput">Bypass list (comma-separated)</label>
      <input id="bypassInput" type="text" placeholder="localhost, 127.0.0.1, *.local" />
    </section>
  </div>
  <script src="popup.js"></script>
</body>
</html>
